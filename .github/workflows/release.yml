# Publishes durable evidence for one already-public Wald evaluator image.
# A maintainer dispatches it after the matching image is anonymously pullable;
# it runs the tagged benchmark by digest and attaches checksummed source and
# result archives to this repository's matching GitHub release.
name: publish benchmark evidence

on:
  workflow_dispatch:
    inputs:
      version:
        description: Wald release version without the leading v
        required: true
        default: 0.1.3
        type: string

permissions:
  contents: write

concurrency:
  group: benchmark-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Require a 0.1 release version
        run: |
          case "$VERSION" in
            0.1.[0-9]*) ;;
            *) echo "::error::Expected a version such as 0.1.0"; exit 1 ;;
          esac
          case "$VERSION" in
            *[!0-9.]*) echo "::error::Version contains unsupported characters"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - name: Require the benchmark and image versions to agree
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("benchmark/public-assessment-v0.1/assessment.json", encoding="utf-8") as source:
              benchmark_version = json.load(source).get("version")
          if benchmark_version != os.environ["VERSION"]:
              raise SystemExit(
                  f"benchmark version {benchmark_version!r} does not match {os.environ['VERSION']!r}"
              )
          PY
      - name: Pull the public image anonymously and resolve its digest
        run: |
          image="ghcr.io/finesample-lab/wald:v$VERSION"
          anonymous_config=$(mktemp -d)
          trap 'rm -rf -- "$anonymous_config"' EXIT
          DOCKER_CONFIG="$anonymous_config" docker pull "$image"
          image_reference=$(docker image inspect --format='{{index .RepoDigests 0}}' "$image")
          case "$image_reference" in
            ghcr.io/finesample-lab/wald@sha256:*) ;;
            *) echo "::error::Image did not resolve to the expected digest reference"; exit 1 ;;
          esac
          printf '%s\n' "$image_reference" > image-reference.txt
      - uses: sigstore/cosign-installer@v3
      - name: Verify the image identity, evidence, and bundled benchmark
        run: |
          image_reference=$(cat image-reference.txt)
          issuer=https://token.actions.githubusercontent.com
          identity="https://github.com/finesample-lab/wald/.github/workflows/release.yml@refs/tags/v$VERSION"
          cosign verify --certificate-oidc-issuer "$issuer" \
            --certificate-identity "$identity" "$image_reference" >/dev/null
          for predicate in spdxjson custom slsaprovenance1; do
            cosign verify-attestation --certificate-oidc-issuer "$issuer" \
              --certificate-identity "$identity" --type "$predicate" \
              "$image_reference" >/dev/null
          done
          expected_revision=$(git rev-parse HEAD)
          image_revision=$(docker image inspect \
            --format '{{index .Config.Labels "io.finesample.wald.benchmark.revision"}}' \
            "$image_reference")
          test "$image_revision" = "$expected_revision"
          candidate=$(docker create "$image_reference")
          image_benchmark=$(mktemp -d)
          cleanup() {
            docker rm -f "$candidate" >/dev/null 2>&1 || true
            rm -rf -- "$image_benchmark"
          }
          trap cleanup EXIT
          docker cp \
            "$candidate:/usr/share/doc/wald/public-assessment-v0.1/." \
            "$image_benchmark"
          diff -ru benchmark/public-assessment-v0.1 "$image_benchmark"
      - name: Run the tagged public benchmark against the exact image
        run: |
          benchmark/public-assessment-v0.1/run.sh \
            --image "$(cat image-reference.txt)" \
            --out "$RUNNER_TEMP/wald-assessment-v$VERSION"
      - name: Build deterministic release archives
        run: |
          artifact_dir="$RUNNER_TEMP/artifacts"
          source_name="wald-public-assessment-v$VERSION"
          result_name="wald-public-assessment-v$VERSION-results"
          mkdir -p "$artifact_dir" "$RUNNER_TEMP/$source_name" "$RUNNER_TEMP/$result_name"
          cp -R benchmark/public-assessment-v0.1/. "$RUNNER_TEMP/$source_name/"
          cp LICENSE EVALUATION-TERMS.md image-reference.txt "$RUNNER_TEMP/$source_name/"
          cp -R "$RUNNER_TEMP/wald-assessment-v$VERSION/." "$RUNNER_TEMP/$result_name/"
          cp image-reference.txt "$RUNNER_TEMP/$result_name/"
          git rev-parse HEAD > "$RUNNER_TEMP/$result_name/benchmark-commit.txt"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' \
            -C "$RUNNER_TEMP" -cf - "$source_name" | gzip -n > "$artifact_dir/$source_name.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' \
            -C "$RUNNER_TEMP" -cf - "$result_name" | gzip -n > "$artifact_dir/$result_name.tar.gz"
          cp image-reference.txt "$artifact_dir/image-reference.txt"
          cp "$RUNNER_TEMP/wald-assessment-v$VERSION/backtest.json" "$artifact_dir/backtest.json"
          cp "$RUNNER_TEMP/wald-assessment-v$VERSION/backtest.md" "$artifact_dir/backtest.md"
          cp "$RUNNER_TEMP/wald-assessment-v$VERSION/assessment-manifest.json" \
            "$artifact_dir/assessment-manifest.json"
          (cd "$artifact_dir" && sha256sum \
            *.json *.md *.tar.gz image-reference.txt > SHA256SUMS)
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          artifact_dir="$RUNNER_TEMP/artifacts"
          result_hash=$(python3 - <<'PY'
          import json
          with open("benchmark/public-assessment-v0.1/assessment.json", encoding="utf-8") as source:
              print(json.load(source)["expected"]["resultSha256"])
          PY
          )
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "This release ran Wald's public 0.1 benchmark against the exact image digest in \`image-reference.txt\`."
            echo
            echo "Expected result hash: \`$result_hash\`"
            echo
            echo "Verify the downloaded assets with \`sha256sum -c SHA256SUMS\`."
          } > "$notes"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$artifact_dir"/*
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Wald Benchmark $tag" --notes-file "$notes"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Wald Benchmark $tag" --notes-file "$notes" "$artifact_dir"/*
          fi
